name: Publish npm and GitHub Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize both supported branches so concurrent runs cannot race to publish a version.
concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cqai-club/cqai-dsh-plugin-xiaobao' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Install npm with trusted publisher support
        run: npm install --global npm@11.16.0 --ignore-scripts
      # npm uses this job's OIDC identity; configure the package's trusted publisher
      # for this repository and exactly publish.yml after the one-time bootstrap.
      - name: Validate, publish if needed, and reconcile the GitHub Release
        run: node scripts/release-publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
